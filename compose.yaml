services:
  postgres:
    image: postgres:17
    container_name: openslots-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openslots
      POSTGRES_PASSWORD: openslots_dev
      POSTGRES_DB: openslots
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: