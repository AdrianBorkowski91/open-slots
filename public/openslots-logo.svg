<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="533" viewBox="0 0 2172 724" role="img" aria-labelledby="title description">
  <title id="title">OpenSlots</title>
  <desc id="description">Purple calendar with a selected slot, followed by the OpenSlots wordmark.</desc>
  <defs>
    <linearGradient id="calendar-purple" x1=".12" y1="0" x2=".9" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#6938DF"/><stop offset=".55" stop-color="#5221C5"/><stop offset="1" stop-color="#3F159B"/>
    </linearGradient>
    <linearGradient id="calendar-top" x1="0" y1="0" x2=".8" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#8956F4"/><stop offset="1" stop-color="#4920B2"/>
    </linearGradient>
    <linearGradient id="tab-purple" x1="0" y1="0" x2="1" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#7A46EE"/><stop offset="1" stop-color="#4620AB"/>
    </linearGradient>
    <linearGradient id="calendar-inner" x1="0" y1="0" x2=".8" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#DDD0FF"/><stop offset=".6" stop-color="#EEE7FF"/><stop offset="1" stop-color="#C7B3FF"/>
    </linearGradient>
    <linearGradient id="checked-purple" x1="0" y1="0" x2="1" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#7642EA"/><stop offset="1" stop-color="#4212A9"/>
    </linearGradient>
    <linearGradient id="wordmark-purple" x1="0" y1="0" x2="0" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#6D35D4"/><stop offset="1" stop-color="#501CAD"/>
    </linearGradient>
  </defs>
  <g id="calendar-mark">
  <!-- Calendar body -->
  <rect x="191" y="204" width="381" height="328" rx="77" fill="url(#calendar-purple)"/>
  <path d="M268 204h224a80 80 0 0 1 80 80v26H191v-26a80 80 0 0 1 77-80Z" fill="url(#calendar-top)" opacity=".5"/>
  <!-- Date binder tabs -->
  <rect x="280" y="166" width="49" height="92" rx="24.5" fill="url(#tab-purple)" stroke="#43149F" stroke-width="2"/>
  <rect x="422" y="166" width="49" height="92" rx="24.5" fill="url(#tab-purple)" stroke="#43149F" stroke-width="2"/>
  <!-- Light inner face -->
  <rect x="222" y="287" width="319" height="216" rx="48" fill="url(#calendar-inner)"/>
  <rect x="222" y="287" width="319" height="216" rx="48" stroke="#E8E0FF" stroke-opacity=".45" stroke-width="2" fill="none"/>
  <!-- Day cells, deliberately subdued -->
  <g fill="#BDB0F2" fill-opacity=".52">
    <rect x="261" y="325" width="65" height="58" rx="12"/>
    <rect x="337" y="325" width="65" height="58" rx="12"/>
    <rect x="413" y="325" width="65" height="58" rx="12"/>
    <rect x="261" y="402" width="65" height="57" rx="12"/>
    <rect x="337" y="402" width="65" height="57" rx="12"/>
  </g>
  <!-- Selected calendar slot -->
  <rect x="415" y="384" width="96" height="90" rx="24" fill="url(#checked-purple)"/>
  <path d="m438 427 21 21 35-41" fill="none" stroke="#D9C8FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g>
